<!-- Shipping Banner Component -->
<div class="swift-shipping-banner">
  <div class="swift-shipping-banner__container">
    <div class="swift-shipping-banner__content">
      <!-- Frete Section -->
      <div class="swift-shipping-banner__section">
        <img
          src="./assets/truck8139-m5j.svg"
          alt=""
          aria-hidden="true"
          class="swift-shipping-banner__icon"
        />
        <span class="swift-shipping-banner__text">
          Frete grátis a partir de R$ 299,00 em São Paulo com entrega agendada e em 1 dia útil.
        </span>
      </div>
      
      <!-- Region Section -->
      <div class="swift-shipping-banner__section">
        <button class="swift-shipping-banner__region-link" id="swift-region-selector">
          <span class="swift-shipping-banner__region-text">Confira sua região</span>
          <svg class="swift-shipping-banner__region-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6,9 12,15 18,9"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
