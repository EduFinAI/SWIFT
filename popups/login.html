<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift - Login</title>
    <link rel="stylesheet" href="login.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cadastro-container">
        <div class="cadastro-box">
            
            <header class="cadastro-header">
                <a href="login.html" class="header-link active">Login</a>
                <a href="cadastro.html" class="header-link">Cadastro</a>
                <button class="close-button" id="closeBtn" aria-label="Fechar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                </button>
            </header>

            <main class="cadastro-main">
                <section class="welcome-section">
                    <img src="imagens/logo-swift.png" alt="Logo Swift" class="logo-swift-image">
                    <p class="subtitle">Entre com seu e-mail e senha:</p>
                </section>

                <form class="cadastro-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@dominio.com">
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">
                            <button type="button" class="password-toggle" id="togglePassword">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-button">Entrar</button>

                    <div class="login-links">
                        <a href="#">Esqueci minha senha.</a>
                        <p>Não tem conta? <a href="cadastro.html">Cadastre-se agora mesmo!</a></p>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
