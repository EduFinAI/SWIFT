<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift - Cadastro</title>
    <link rel="stylesheet" href="cadastro.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cadastro-container">
        <div class="cadastro-box">
            
            <header class="cadastro-header">
                <a href="login.html" class="header-link">Login</a>
                <a href="cadastro.html" class="header-link active">Cadastro</a>
                <button class="close-button" id="closeBtn" aria-label="Fechar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                </button>
            </header>

            <main class="cadastro-main">
                <section class="welcome-section">
                    <h1>Bem-vindo(a) a</h1>
                    <img src="imagens/logo-swift.png" alt="Logo Swift" class="logo-swift-image">
                </section>

                <form class="cadastro-form" id="cadastroForm">
                    <div class="person-type-group">
                        <div class="radio-option">
                            <input type="radio" id="pessoaFisica" name="tipo_pessoa" value="fisica" checked>
                            <label for="pessoaFisica">Pessoa Física</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="pessoaJuridica" name="tipo_pessoa" value="juridica">
                            <label for="pessoaJuridica">Pessoa Jurídica</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@dominio.com">
                    </div>

                    <div class="form-group">
                        <label for="primeiro-nome">Primeiro nome *</label>
                        <input type="text" id="primeiro-nome" name="primeiro-nome" required placeholder="Digite seu primeiro nome">
                    </div>

                    <div class="form-group">
                        <label for="ultimo-nome">Último Nome *</label>
                        <input type="text" id="ultimo-nome" name="ultimo-nome" required placeholder="Digite seu último nome">
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="celular">Telefone celular *</label>
                            <input type="tel" id="celular" name="celular" required placeholder="(11) 99999-9999">
                        </div>
                        <div class="form-group">
                            <label for="nascimento">Data de Nascimento</label>
                            <input type="date" id="nascimento" name="nascimento" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="senha">Cadastre uma Senha *</label>
                        <input type="password" id="senha" name="senha" required placeholder="Crie uma senha forte">
                        <p class="password-hint">A senha deve conter 8+ caracteres, incluindo 1 número, 1 maiúscula, 1 minúscula e 1 caractere especial.</p>
                    </div>

                    <div class="form-group">
                        <label for="confirmar-senha">Repetir Senha *</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" required placeholder="Repita a senha criada">
                    </div>

                    <fieldset class="form-group-checkbox">
                        <div class="checkbox-option">
                            <input type="checkbox" id="politica" name="politica" required>
                            <label for="politica">Li e aceito a <a href="#">Política de privacidade</a></label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="socio" name="socio">
                            <label for="socio">Aceito participar do programa <a href="#">Sócio Swift</a></label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="comunicacoes" name="comunicacoes">
                            <label for="comunicacoes">Quero receber comunicações da Swift</label>
                        </div>
                    </fieldset>

                    <button type="submit" class="submit-button">Cadastrar</button>

                    <div class="login-links">
                        <p>Já tem conta? <a href="login.html">Faça login.</a></p>
                    </div>

                </form>
            </main>
        </div>
    </div>
    
    <script src="cadastro.js"></script>
</body>
</html>
